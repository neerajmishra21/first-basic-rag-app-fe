<div class="chat-wrapper">
  
  <!-- Header -->
  <div class="chat-header">
    <div class="header-content">
      <mat-icon class="header-icon">chat</mat-icon>
      <div class="header-text">
        <h2>AI Assistant</h2>
        <p>{{ uploadStatus }}</p>
      </div>
    </div>

    <div class="upload-actions">
      <input
        #fileInput
        class="file-input"
        type="file"
        accept=".pdf"
        (change)="onFileSelected($event)"
      />

      <button
        mat-stroked-button
        type="button"
        class="upload-button"
        (click)="openFilePicker()"
        [disabled]="isUploading"
      >
        <mat-icon *ngIf="!isUploading">upload_file</mat-icon>
        <mat-spinner
          *ngIf="isUploading"
          diameter="18"
          class="upload-spinner"
        ></mat-spinner>
        {{ isUploading ? 'Uploading' : 'Upload PDF' }}
      </button>
    </div>
  </div>

  <!-- Messages Container -->
  <div class="messages-container" #messagesContainer>
    
    <!-- Empty State -->
    <div class="empty-state" *ngIf="messages.length === 0 && !isLoading">
      <mat-icon class="empty-icon">question_answer</mat-icon>
      <h3>Start a Conversation</h3>
      <p>Ask me anything about your PDF document</p>
    </div>

    <!-- Messages -->
    <div class="messages-list">
      <!-- <pre>{{messages | json}}</pre> -->
      <div
        *ngFor="let message of messages"
        class="message-wrapper"
        [ngClass]="message.type"
      >
        <div class="message-bubble">
          <div class="message-content">
            {{ message.text }}
          </div>
          <div class="message-time">
            {{ formatTime(message.timestamp) }}
          </div>
        </div>
      </div>

      <!-- Loading Indicator -->
      <div class="message-wrapper ai" *ngIf="isLoading">
        <div class="message-bubble loading-bubble">
          <div class="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Input Area -->
  <div class="input-wrapper">
    <div class="input-container">
      <input
        type="text"
        class="message-input"
        placeholder="Type your question here..."
        [(ngModel)]="question"
        (keydown)="onEnterPress($event)"
        [disabled]="isLoading"
      />
      
      <button
        mat-fab
        color="primary"
        class="send-button"
        (click)="askQuestion()"
        [disabled]="!question.trim() || isLoading"
      >
        <mat-icon *ngIf="!isLoading">send</mat-icon>
        <mat-spinner 
          *ngIf="isLoading" 
          diameter="24"
          class="button-spinner"
        ></mat-spinner>
      </button>
    </div>
  </div>

</div>
